services:
  # Render Web Service for FastAPI Backend
  - type: web
    name: hirelens-api
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: hirelens-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

# Managed PostgreSQL Database on Render (Or link Supabase DATABASE_URL)
databases:
  - name: hirelens-postgres
    region: singapore
    plan: free
    databaseName: hirelens_db
    user: hirelens_user
